<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Practice - Online Only</title>
    <style>
        /* 
         * ==========================================
         * CSS STYLES
         * Modern Glassmorphism Design
         * ==========================================
         */
        :root {
            --primary: #DD0000; /* German Flag Red */
            --secondary: #FFCE00; /* German Flag Gold */
            --dark: #1a1a1a;
            --light: #f4f4f9;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--glass);
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 { color: var(--primary); margin-bottom: 10px; }
        h2 { color: #555; font-size: 1.2rem; margin-top: 0; }

        /* Controls Section */
        .controls {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        label { font-weight: bold; font-size: 0.9rem; color: #666; }
        
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover { background: #b30000; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        button.secondary {
            background: transparent;
            color: var(--dark);
            border: 2px solid var(--dark);
            margin-top: 10px;
        }
        button.secondary:hover { background: var(--dark); color: white; }

        /* Game Area */
        #game-area { display: none; margin-top: 20px; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .word-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .main-word {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--dark);
            margin: 10px 0;
        }

        .context-box {
            background: #f9f9f9;
            border-left: 4px solid var(--secondary);
            padding: 10px;
            margin-top: 15px;
            text-align: left;
            font-style: italic;
            display: none; /* Hidden until answered */
            animation: fadeIn 0.5s;
        }

        /* Input Modes */
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin: 10px 0;
        }
        input[type="text"]:focus { border-color: var(--primary); outline: none; }

        /* Multiple Choice Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background: white;
            color: var(--dark);
            border: 2px solid #ddd;
            padding: 15px;
            font-size: 1rem;
        }
        .option-btn:hover { background: #f0f0f0; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }

        /* Sentence Builder */
        .sentence-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 15px 0;
            min-height: 50px;
        }
        .word-chip {
            background: var(--dark);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
        }
        .word-chip.used { opacity: 0.3; pointer-events: none; }
        
        .sentence-slot {
            border-bottom: 2px dashed #ccc;
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            padding: 5px;
            margin: 10px 0;
        }

        /* Feedback Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.3s; }

        /* Stats View */
        #stats-view { display: none; text-align: left; }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .stat-val { font-weight: bold; color: var(--primary); }

        /* Loading Spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="container">
    <h1>🇩🇪 German Practice</h1>
    <h2>Online Vocabulary Builder</h2>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <div class="controls">
            <div>
                <label>1. Choose Topic (API Search Term)</label>
                <select id="category-select">
                    <option value="travel">Travel & Transport</option>
                    <option value="food">Food & Drink</option>
                    <option value="family">Family & People</option>
                    <option value="house">House & Home</option>
                    <option value="work">Work & Business</option>
                    <option value="nature">Nature & Animals</option>
                    <option value="city">City & Directions</option>
                    <option value="time">Time & Dates</option>
                    <option value="clothes">Clothes & Fashion</option>
                    <option value="health">Health & Body</option>
                    <option value="school">School & Education</option>
                    <option value="emotions">Emotions & Feelings</option>
                    <option value="colors">Colors & Shapes</option>
                    <option value="sports">Sports & Hobbies</option>
                    <option value="technology">Technology</option>
                </select>
            </div>

            <div>
                <label>2. Practice Mode</label>
                <select id="mode-select">
                    <option value="type">Type the Translation</option>
                    <option value="multiple">Multiple Choice</option>
                    <option value="listening">Listening Dictation</option>
                    <option value="sentence">Sentence Builder</option>
                </select>
            </div>

            <div>
                <label>3. Direction</label>
                <select id="direction-select">
                    <option value="de-en">German ➝ English</option>
                    <option value="en-de">English ➝ German</option>
                </select>
            </div>

            <button onclick="app.fetchAndStart()">Fetch Words & Start</button>
            <div id="loader" class="loader"></div>
            <p id="status-msg" style="font-size: 0.8rem; color: #666; margin-top: 5px;"></p>
        </div>
        
        <button class="secondary" onclick="app.showStats()">📊 View Progress Stats</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-area">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        
        <div style="display:flex; justify-content:space-between; color:#888; font-size:0.9rem;">
            <span id="mode-display">Mode: Type</span>
            <span id="score-display">Score: 0</span>
        </div>

        <div class="word-card">
            <!-- Dynamic Content injected here -->
            <div id="question-container"></div>
            
            <!-- Context/Example revealed after answer -->
            <div id="context-reveal" class="context-box">
                <strong>Example:</strong> <span id="example-text"></span>
            </div>
        </div>

        <div id="feedback-area" style="min-height: 40px; font-weight:bold;"></div>

        <button id="action-btn" onclick="app.handleAction()">Submit</button>
        <button class="secondary" onclick="app.quitSession()">End Session</button>
    </div>

    <!-- STATS SCREEN -->
    <div id="stats-view">
        <h3>Your Progress</h3>
        <div id="stats-content"></div>
        <button onclick="document.getElementById('stats-view').style.display='none'; document.getElementById('setup-screen').style.display='block'">Back</button>
        <button class="secondary" onclick="app.resetData()" style="background:#dc3545; border-color:#dc3545; color:white;">Reset All Data</button>
    </div>
</div>

<script>
/**
 * ==========================================
 * JAVASCRIPT LOGIC
 * Fully Online-First Architecture
 * 
 * HOW IT WORKS:
 * 1. User selects a topic (e.g., "travel")
 * 2. App fetches real translations from MyMemory API
 * 3. App creates a practice session with those words
 * 4. No local database - everything is fetched live
 * ==========================================
 */

const app = {
    // State Variables
    currentWords: [],      // Words fetched from API for this session
    currentIndex: 0,       // Current word index
    score: 0,              // Session score
    mode: 'type',          // Current game mode
    direction: 'de-en',    // Translation direction
    userInput: '',         // For sentence builder
    selectedOption: null,  // For multiple choice
    
    // DOM Elements Cache
    els: {
        setup: document.getElementById('setup-screen'),
        game: document.getElementById('game-area'),
        stats: document.getElementById('stats-view'),
        loader: document.getElementById('loader'),
        status: document.getElementById('status-msg'),
        question: document.getElementById('question-container'),
        context: document.getElementById('context-reveal'),
        exampleText: document.getElementById('example-text'),
        feedback: document.getElementById('feedback-area'),
        actionBtn: document.getElementById('action-btn'),
        progress: document.getElementById('progress-fill'),
        score: document.getElementById('score-display'),
        modeDisplay: document.getElementById('mode-display')
    },

    /**
     * INITIALIZATION
     * Loads saved stats from localStorage on startup
     */
    init() {
        const stats = this.getStats();
        console.log("App initialized. Total practiced:", stats.totalPracticed);
    },

    /**
     * API FETCHING
     * Uses MyMemory API to get translations based on category keyword.
     * NOTE: Free API has rate limits. We fetch ~15 pairs per session.
     */
    async fetchAndStart() {
        const category = document.getElementById('category-select').value;
        this.mode = document.getElementById('mode-select').value;
        this.direction = document.getElementById('direction-select').value;

        // UI Updates
        this.els.setup.style.display = 'none';
        this.els.loader.style.display = 'block';
        this.els.status.textContent = `Fetching "${category}" words from online database...`;
        this.els.game.style.display = 'block';
        this.els.modeDisplay.textContent = `Mode: ${this.mode.charAt(0).toUpperCase() + this.mode.slice(1)}`;

        try {
            // Construct API URL
            // We ask for German-English pairs containing the category keyword
            const langPair = "de-en";
            const query = encodeURIComponent(category);
            const url = `https://api.mymemory.translated.net/get?q=${query}&langpair=${langPair}&pagesize=15`;

            const response = await fetch(url);
            const data = await response.json();

            if (!data.responseStatus || data.responseStatus !== 200) {
                throw new Error("API returned error or empty results");
            }

            // Process API Results into clean objects
            this.currentWords = data.matches.map(match => {
                // Clean up text (remove HTML tags sometimes returned)
                const cleanDe = match.segment.replace(/<[^>]*>?/gm, '').trim();
                const cleanEn = match.translation.replace(/<[^>]*>?/gm, '').trim();
                
                return {
                    de: cleanDe,
                    en: cleanEn,
                    // Try to extract a context/example if available, otherwise generic
                    example: match.reference ? `Source: ${match.reference}` : `Used in context of "${category}"`
                };
            }).filter(w => w.de.length > 2 && w.en.length > 2); // Filter garbage short words

            if (this.currentWords.length === 0) {
                throw new Error("No valid words found. Try a different category.");
            }

            // Shuffle words for randomness
            this.currentWords.sort(() => Math.random() - 0.5);
            
            this.currentIndex = 0;
            this.score = 0;
            this.loadQuestion();

        } catch (error) {
            console.error(error);
            alert(`Error fetching words: ${error.message}\n\nPlease try a different category or check your internet connection.`);
            this.els.game.style.display = 'none';
            this.els.setup.style.display = 'block';
            this.els.loader.style.display = 'none';
            this.els.status.textContent = "";
        }
    },

    /**
     * RENDER QUESTION
     * Dynamically builds HTML based on selected mode (Type, Multiple, Listen, Sentence)
     */
    loadQuestion() {
        const wordObj = this.currentWords[this.currentIndex];
        const isDeToEn = this.direction === 'de-en';
        
        const promptWord = isDeToEn ? wordObj.de : wordObj.en;
        const targetWord = isDeToEn ? wordObj.en : wordObj.de;
        const targetLang = isDeToEn ? 'en' : 'de'; // For speech synthesis

        // Reset UI
        this.els.context.style.display = 'none';
        this.els.feedback.textContent = '';
        this.els.feedback.style.color = 'inherit';
        this.els.actionBtn.textContent = "Submit";
        this.els.actionBtn.disabled = false;
        this.userInput = []; // Reset sentence builder
        this.selectedOption = null;

        // Update Progress Bar
        const pct = ((this.currentIndex) / this.currentWords.length) * 100;
        this.els.progress.style.width = `${pct}%`;
        this.els.score.textContent = `Score: ${this.score}`;

        let html = '';

        // --- MODE: TYPE ANSWER ---
        if (this.mode === 'type') {
            html = `
                <div style="color:#888; font-size:0.9rem;">Translate this:</div>
                <div class="main-word">${promptWord}</div>
                <input type="text" id="user-input" placeholder="Type translation..." autocomplete="off">
            `;
            setTimeout(() => document.getElementById('user-input').focus(), 100);

        // --- MODE: MULTIPLE CHOICE ---
        } else if (this.mode === 'multiple') {
            // Generate 3 wrong answers + 1 correct
            const options = [targetWord];
            while (options.length < 4) {
                const randomWord = this.currentWords[Math.floor(Math.random() * this.currentWords.length)];
                const wrong = isDeToEn ? randomWord.en : randomWord.de;
                if (!options.includes(wrong) && wrong !== targetWord) {
                    options.push(wrong);
                }
                // Safety break if pool is small
                if (this.currentWords.length < 4 && options.length < this.currentWords.length) break;
            }
            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            html = `
                <div style="color:#888; font-size:0.9rem;">Select the correct translation:</div>
                <div class="main-word">${promptWord}</div>
                <div class="options-grid">
                    ${options.map(opt => `<button class="option-btn" onclick="app.selectOption(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                </div>
            `;

        // --- MODE: LISTENING ---
        } else if (this.mode === 'listening') {
            // Auto-play audio
            this.speak(promptWord, isDeToEn ? 'de-DE' : 'en-US');
            
            html = `
                <div style="color:#888; font-size:0.9rem;">Listen and type what you hear:</div>
                <div style="font-size:3rem; margin:20px;">🔊</div>
                <button class="secondary" onclick="app.speak('${promptWord}', '${isDeToEn ? 'de-DE' : 'en-US'}')" style="width:auto; padding:5px 15px;">🔁 Play Again</button>
                <br>
                <input type="text" id="user-input" placeholder="Type what you heard..." autocomplete="off">
            `;
            setTimeout(() => document.getElementById('user-input').focus(), 500);

        // --- MODE: SENTENCE BUILDER ---
        } else if (this.mode === 'sentence') {
            // For sentence mode, we need a sentence. 
            // Since API gives phrases, we'll construct a simple "The [word] is [adjective]" or just use the phrase if long.
            // Ideally, we'd fetch full sentences, but for this demo we simulate structure.
            
            // Simple heuristic: If the phrase is long, treat as sentence. If short, wrap it.
            let sentence = wordObj.de; 
            let translation = wordObj.en;
            
            // If direction is En->De, swap
            if (!isDeToEn) {
                sentence = wordObj.en;
                translation = wordObj.de;
            }

            // Split sentence into words for chips
            const words = sentence.split(' ');
            
            html = `
                <div style="color:#888; font-size:0.9rem;">Build the German sentence:</div>
                <div class="main-word" style="font-size:1.5rem;">${translation}</div>
                
                <div class="sentence-slot" id="sentence-slot"></div>
                <div class="sentence-bank" id="sentence-bank">
                    ${words.map((w, i) => `<div class="word-chip" onclick="app.moveWord(this, '${w.replace(/'/g, "\\'")}')">${w}</div>`).join('')}
                </div>
                <button class="secondary" onclick="app.resetSentence()" style="font-size:0.8rem; padding:5px 10px; width:auto;">Reset</button>
            `;
        }

        this.els.question.innerHTML = html;
    },

    /**
     * INTERACTION HELPERS
     */
    selectOption(btn, value) {
        // Visual selection
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'wrong'));
        btn.classList.add('correct'); // Temp highlight
        this.selectedOption = value;
        this.handleAction(); // Auto submit
    },

    speak(text, lang) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Your browser does not support Text-to-Speech.");
        }
    },

    moveWord(el, word) {
        const slot = document.getElementById('sentence-slot');
        const bank = document.getElementById('sentence-bank');
        
        if (el.parentElement === bank) {
            // Move to slot
            el.classList.add('used');
            slot.appendChild(el);
            this.userInput.push(word);
        } else {
            // Move back to bank
            el.classList.remove('used');
            bank.appendChild(el);
            this.userInput = this.userInput.filter(w => w !== word); // Remove first occurrence
        }
    },

    resetSentence() {
        const slot = document.getElementById('sentence-slot');
        const bank = document.getElementById('sentence-bank');
        while (slot.firstChild) {
            const el = slot.firstChild;
            el.classList.remove('used');
            bank.appendChild(el);
        }
        this.userInput = [];
    },

    /**
     * GAME LOGIC & VALIDATION
     */
    handleAction() {
        const wordObj = this.currentWords[this.currentIndex];
        const isDeToEn = this.direction === 'de-en';
        const correctAnswer = isDeToEn ? wordObj.en : wordObj.de;
        
        let userAnswer = '';
        let isCorrect = false;

        // Gather input based on mode
        if (this.mode === 'type' || this.mode === 'listening') {
            const inputEl = document.getElementById('user-input');
            if (!inputEl) return;
            userAnswer = inputEl.value.trim();
        } else if (this.mode === 'multiple') {
            userAnswer = this.selectedOption;
            if (!userAnswer) return; // Wait for selection
        } else if (this.mode === 'sentence') {
            userAnswer = this.userInput.join(' ');
        }

        // Normalize for comparison (case insensitive, ignore punctuation)
        const normalize = (str) => str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
        
        // Special handling for Sentence Mode (fuzzy match allowed?)
        // For now, strict match required for simplicity, but we can relax later
        if (normalize(userAnswer) === normalize(correctAnswer)) {
            isCorrect = true;
        }

        // Handle Result
        if (isCorrect) {
            this.score++;
            this.els.feedback.textContent = "✅ Correct!";
            this.els.feedback.style.color = "green";
            this.updateSRS(wordObj, true);
        } else {
            this.els.feedback.textContent = `❌ Wrong! The answer was: ${correctAnswer}`;
            this.els.feedback.style.color = "red";
            this.els.question.classList.add('shake');
            setTimeout(() => this.els.question.classList.remove('shake'), 500);
            this.updateSRS(wordObj, false);
        }

        // Show Context Example
        this.els.exampleText.textContent = wordObj.example;
        this.els.context.style.display = 'block';

        // Disable input
        this.els.actionBtn.disabled = true;
        this.els.actionBtn.textContent = "Next →";

        // Prepare Next Step
        this.els.actionBtn.onclick = () => {
            this.currentIndex++;
            if (this.currentIndex < this.currentWords.length) {
                this.els.actionBtn.onclick = () => this.handleAction(); // Reset handler
                this.loadQuestion();
            } else {
                this.endSession();
            }
        };
    },

    /**
     * SESSION END & STATS
     */
    endSession() {
        const accuracy = Math.round((this.score / this.currentWords.length) * 100);
        alert(`Session Complete!\nScore: ${this.score}/${this.currentWords.length}\nAccuracy: ${accuracy}%`);
        this.quitSession();
    },

    quitSession() {
        this.els.game.style.display = 'none';
        this.els.setup.style.display = 'block';
        this.els.status.textContent = "";
    },

    /**
     * DATA PERSISTENCE (LocalStorage)
     * Simple SRS: Tracks 'strength' of a word. 
     * Correct = strength++, Wrong = strength--
     */
    getStats() {
        const data = localStorage.getItem('germanAppStats');
        return data ? JSON.parse(data) : { totalPracticed: 0, correct: 0, streak: 0, words: {} };
    },

    saveStats(stats) {
        localStorage.setItem('germanAppStats', JSON.stringify(stats));
    },

    updateSRS(wordObj, isCorrect) {
        const stats = this.getStats();
        const key = wordObj.de; // Use German word as unique key

        stats.totalPracticed++;
        if (isCorrect) stats.correct++;

        if (!stats.words[key]) stats.words[key] = { strength: 0, lastSeen: Date.now() };
        
        if (isCorrect) {
            stats.words[key].strength += 1;
            stats.streak++;
        } else {
            stats.words[key].strength = Math.max(0, stats.words[key].strength - 1);
            stats.streak = 0;
        }
        stats.words[key].lastSeen = Date.now();

        this.saveStats(stats);
    },

    showStats() {
        const stats = this.getStats();
        const accuracy = stats.totalPracticed > 0 ? Math.round((stats.correct / stats.totalPracticed) * 100) : 0;
        const mastered = Object.values(stats.words).filter(w => w.strength >= 5).length;

        document.getElementById('stats-content').innerHTML = `
            <div class="stat-item"><span>Total Words Practiced:</span> <span class="stat-val">${stats.totalPracticed}</span></div>
            <div class="stat-item"><span>Overall Accuracy:</span> <span class="stat-val">${accuracy}%</span></div>
            <div class="stat-item"><span>Current Streak:</span> <span class="stat-val">${stats.streak}</span></div>
            <div class="stat-item"><span>Mastered Words (Strength 5+):</span> <span class="stat-val">${mastered}</span></div>
            <div style="margin-top:15px; font-size:0.8rem; color:#666;">
                <em>Note: "Mastered" means you've gotten this word right 5 times in a row across sessions.</em>
            </div>
        `;
        this.els.setup.style.display = 'none';
        this.els.stats.style.display = 'block';
    },

    resetData() {
        if(confirm("Are you sure? This will delete all progress.")) {
            localStorage.removeItem('germanAppStats');
            alert("Data reset successfully.");
            this.showStats();
        }
    }
};

// Start App
app.init();

</script>
</body>
</html>
